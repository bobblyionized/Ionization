name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        # Quoted: PowerShell would otherwise split "-DX=1.0.5" at the first dot.
        run: cmake -S . -B build -A x64 "-DIONIZATION_VERSION=1.0.${{ github.run_number }}"

      - name: Build
        run: cmake --build build --config Release -- /m /v:minimal

      - name: Verify version stamp
        shell: pwsh
        run: |
          $v = (Get-Item build/Release/Ionization.exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion: $v"
          if ($v -ne "1.0.${{ github.run_number }}") { throw "Version stamp mismatch: '$v'" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/Ionization.exe out/Ionization.exe
          $hash = (Get-FileHash out/Ionization.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Ionization.exe" | Out-File -Encoding ascii -NoNewline out/Ionization.exe.sha256
          Get-Content out/Ionization.exe.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $msg = git log -1 --pretty=%s
          gh release create $tag out/Ionization.exe out/Ionization.exe.sha256 `
            --title "Ionization $tag" --notes "$msg" --latest
