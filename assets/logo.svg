<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#6a33e8"/>
      <stop offset="0.55" stop-color="#3a168f"/>
      <stop offset="1" stop-color="#160934"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4f53c"/>
      <stop offset="0.5" stop-color="#7cf0a0"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9a2a"/>
      <stop offset="0.5" stop-color="#e8f25a"/>
      <stop offset="1" stop-color="#9bff6a"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#f1ff9a"/>
      <stop offset="0.7" stop-color="#d4f53c"/>
      <stop offset="1" stop-color="#7fae12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4f53c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d4f53c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0420" flood-opacity="0.6"/></filter>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="214"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="214" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="512" cy="300" rx="560" ry="300" fill="url(#gloss)"/>
    <circle cx="512" cy="520" r="330" fill="url(#glow)"/>
  </g>
  <!-- neon rim -->
  <rect x="64" y="64" width="896" height="896" rx="214" fill="none" stroke="url(#rim)" stroke-width="44" opacity="0.35" filter="url(#soft)"/>
  <rect x="78" y="78" width="868" height="868" rx="200" fill="none" stroke="url(#rim)" stroke-width="22"/>

  <!-- laurels -->
  <g filter="url(#shadow)">
    <g id="branch" fill="url(#leaf)">
      <path d="M300 760 C 230 690 196 600 206 500 C 214 420 246 352 292 300" fill="none" stroke="url(#leaf)" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="250" cy="700" rx="22" ry="58" transform="rotate(-48 250 700)"/>
      <ellipse cx="220" cy="618" rx="22" ry="58" transform="rotate(-28 220 618)"/>
      <ellipse cx="208" cy="532" rx="22" ry="58" transform="rotate(-10 208 532)"/>
      <ellipse cx="216" cy="446" rx="22" ry="56" transform="rotate(10 216 446)"/>
      <ellipse cx="244" cy="366" rx="21" ry="52" transform="rotate(30 244 366)"/>
      <ellipse cx="292" cy="300" rx="19" ry="46" transform="rotate(52 292 300)"/>
      <ellipse cx="300" cy="664" rx="18" ry="46" transform="rotate(-70 300 664)"/>
      <ellipse cx="268" cy="580" rx="18" ry="46" transform="rotate(-56 268 580)"/>
      <ellipse cx="258" cy="494" rx="17" ry="44" transform="rotate(-40 258 494)"/>
    </g>
    <use href="#branch" transform="translate(1024 0) scale(-1 1)"/>
  </g>

  <!-- ion: orbit + nucleus + spark -->
  <g filter="url(#shadow)">
    <ellipse cx="512" cy="512" rx="250" ry="104" fill="none" stroke="url(#gold)" stroke-width="30" transform="rotate(-24 512 512)"/>
    <circle cx="512" cy="512" r="128" fill="url(#core)"/>
    <ellipse cx="470" cy="462" rx="48" ry="30" fill="#ffffff" opacity="0.55" transform="rotate(-30 470 462)"/>
    <!-- front half of the orbit passes over the nucleus -->
    <path d="M 290 590 A 250 104 -24 0 0 734 434" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round" transform="rotate(0 512 512)"/>
    <!-- electron spark -->
    <path d="M736 372 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z" fill="#ffffff"/>
    <circle cx="736" cy="420" r="30" fill="#ffffff" opacity="0.25"/>
  </g>
  <!-- crown spark on top -->
  <path d="M512 196 l22 48 52 10 -38 36 10 52 -46 -26 -46 26 10 -52 -38 -36 52 -10z" fill="url(#gold)" filter="url(#shadow)"/>
</svg>
